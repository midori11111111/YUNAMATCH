<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="使用ポケモンや実力から相性ぴったりのユナイト仲間を探せるUNITE MATE">
  <title>UNITE MATE｜ユナイト仲間を探そう</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 75% 20%,#ffddec,transparent 28%),linear-gradient(135deg,#f0ecff,#fff);font-family:Arial,"Noto Sans JP",sans-serif;color:#17142f}.card{width:min(620px,100%);background:#fff;border:1px solid #e7e1f3;border-radius:28px;padding:55px 35px;text-align:center;box-shadow:0 25px 70px #382d7130}.logo{width:62px;height:62px;margin:auto;display:grid;place-items:center;border-radius:19px;color:#fff;background:linear-gradient(145deg,#6651df,#907cff);font-size:28px;font-weight:900;transform:rotate(-5deg)}h1{font-size:clamp(32px,7vw,54px);margin:24px 0 8px;letter-spacing:-2px}h1 span{color:#6651df}.tag{color:#6e687a;font-size:14px;line-height:1.8;margin-bottom:30px}.button{display:inline-block;color:#fff;text-decoration:none;background:linear-gradient(135deg,#6651df,#816bf0);padding:16px 27px;border-radius:13px;font-size:14px;font-weight:900;box-shadow:0 10px 24px #6651df45}.note{margin-top:18px;color:#9891a2;font-size:10px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">U</div>
    <h1>UNITE <span>MATE</span></h1>
    <p class="tag">ひとりより、ふたりでもっと強く。<br>使用ポケモンと実力から、相性ぴったりのデュオを探そう。</p>
    <a class="button" href="https://unite-mate-jp.tomoki-ashizawa.chatgpt.site">UNITE MATEを始める →</a>
    <p class="note">募集投稿・参加申請にはChatGPTログインが必要です</p>
  </main>
</body>
</html>
